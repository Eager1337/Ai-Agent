name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/command-center-pages, feat/trading-intelligence-cyber-lab]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - name: Install dependencies
        run: bun install --no-save
      - name: Build application
        run: bun run build
      - name: Run tests
        run: bun run test
      # The existing repository-wide Prettier rule currently reports over 1,000 baseline errors.
      # Still lint changed integration files for other ESLint issues while that baseline is handled separately.
      - name: Lint changed integration files
        run: >-
          bunx eslint --rule 'prettier/prettier: off'
          src/lib/integrations.server.ts
          src/routes/_authenticated/trading.tsx
          src/routes/_authenticated/cyber-lab.tsx
          src/routes/api/trading.connect.ts
          src/routes/api/trading.status.ts
          src/routes/api/trading.accounts.ts
          src/routes/api/trading.activities.ts
          src/routes/api/lab.sessions.ts
          'src/routes/api/lab.sessions.$sessionId.ts'
