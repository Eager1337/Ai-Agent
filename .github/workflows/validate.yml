name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/command-center-pages, feat/trading-intelligence-cyber-lab]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17
      - name: Install dependencies
        run: bun install --no-save
      - name: Build application
        run: bun run build
      - name: Run tests
        run: bun run test
      - name: Lint
        run: bun run lint
